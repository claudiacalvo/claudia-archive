<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CLAUDIA_ARCHIVE</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: "Courier New", monospace;
            background: #008080;
            color: black;
        }

        /* ESCRITORIO */

        .desktop {
            height: calc(100vh - 38px);
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 25px;
        }

        /* ICONOS */

        .icon {
            width: 100px;
            text-align: center;
            color: white;
            cursor: pointer;
            user-select: none;
        }

        .icon:hover {
            background: rgba(0,0,0,0.15);
        }

        .icon-image {
            font-size: 42px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-name {
            font-size: 13px;
            line-height: 16px;
            text-shadow: 1px 1px #000;
        }

        /* BARRA INFERIOR */

        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 38px;
            background: #c0c0c0;

            border-top: 2px solid white;

            display: flex;
            align-items: center;
            padding: 3px;
        }

        .start {
            height: 30px;
            padding: 0 12px;

            background: #c0c0c0;

            border-top: 2px solid white;
            border-left: 2px solid white;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;

            font-family: Arial, sans-serif;
            font-weight: bold;
            cursor: pointer;
        }

        .start:active {
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid white;
            border-bottom: 2px solid white;
        }

        .taskbar-info {
            margin-left: auto;
            padding: 5px 12px;
            border: 2px inset #aaa;
            font-size: 12px;
        }

    </style>
</head>

<body>

    <main class="desktop">

        <!-- CARPETAS -->

        <div class="icon">
            <div class="icon-image">📁</div>
            <div class="icon-name">SOBRE_MI</div>
        </div>

        <div class="icon">
            <div class="icon-image">📁</div>
            <div class="icon-name">EXPERIENCIA</div>
        </div>

        <div class="icon">
            <div class="icon-image">📁</div>
            <div class="icon-name">PROYECTOS</div>
        </div>

        <div class="icon">
            <div class="icon-image">📁</div>
            <div class="icon-name">IDEAS</div>
        </div>

        <div class="icon">
            <div class="icon-image">📁</div>
            <div class="icon-name">HISTORIAS</div>
        </div>

        <div class="icon">
            <div class="icon-image">📁</div>
            <div class="icon-name">CONTACTO</div>
        </div>

        <!-- ARCHIVOS -->

        <div class="icon">
            <div class="icon-image">📄</div>
            <div class="icon-name">CV_CLAUDIA.pdf</div>
        </div>

        <div class="icon">
            <div class="icon-image">🗑️</div>
            <div class="icon-name">PAPELERA</div>
        </div>

    </main>

    <!-- BARRA DE TAREAS -->

    <div class="taskbar">

        <button class="start">
            🪟 INICIO
        </button>

        <div class="taskbar-info">
            CLAUDIA_ARCHIVE.exe
        </div>

    </div>

</body>
</html>
